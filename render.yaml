services:
  # 1. Painel BI Interativo Northwind (Docker Web Service)
  - type: web
    name: northwind-dashboard
    runtime: docker
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 80

  # 2. Portfólio Web de Dados & IA (Static Site - Rápido, Gratuito e sem Cold Start)
  - type: web
    name: guilherme-portfolio
    runtime: static
    staticPublishPath: ./portfolio-app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

